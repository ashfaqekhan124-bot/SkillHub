<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHub - Build Skills For The World Ahead</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: #2563eb; }
        .auth-buttons button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .auth-buttons button:hover { background: #1d4ed8; }
        .hero { text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 40px; margin-bottom: 20px; }
        
        /* Modal Popup Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .modal-content h3 { margin-top: 0; color: #2563eb; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .modal-content button { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .modal-content button:hover { background: #1d4ed8; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; cursor: pointer; color: #888; }
        .switch-text { font-size: 12px; text-align: center; margin-top: 15px; cursor: pointer; color: #2563eb; }
    </style>
</head>
<body>

    <header>
        <div class="logo">SKILLHUB</div>
        <div class="auth-buttons">
            <button id="openAuthModal">Log in / Sign Up</button>
        </div>
    </header>

    <div class="hero">
        <h1>BUILD SKILLS FOR THE WORLD AHEAD</h1>
        <p>Explore world-class courses and master new skills online.</p>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3 id="modalTitle">Sign Up</h3>
            
            <input type="email" id="emailInput" placeholder="Enter your email">
            <input type="password" id="passwordInput" placeholder="Enter password (min 6 chars)">
            
            <button id="authActionButton">Register</button>
            <div class="switch-text" id="switchModeText">Already have an account? Log in</div>
        </div>
    </div>

    <!-- Firebase SDKs (CDN Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setTimestamp, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB4i1WM-h4ndIjU_JMuTfKwZ41a1OHGe7Q",
            authDomain: "skillhub-backend-c67c7.firebaseapp.com",
            projectId: "skillhub-backend-c67c7",
            storageBucket: "skillhub-backend-c67c7.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const modal = document.getElementById('authModal');
        const openModalBtn = document.getElementById('openAuthModal');
        const closeModalBtn = document.getElementById('closeModal');
        const authActionButton = document.getElementById('authActionButton');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const modalTitle = document.getElementById('modalTitle');
        const switchModeText = document.getElementById('switchModeText');

        let isLoginMode = false;

        openModalBtn.onclick = () => modal.style.display = 'flex';
        closeModalBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

        // Switch between Signup and Login mode
        switchModeText.onclick = () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                modalTitle.innerText = "Log In";
                authActionButton.innerText = "Log In";
                switchModeText.innerText = "Don't have an account? Sign Up";
            } else {
                modalTitle.innerText = "Sign Up";
                authActionButton.innerText = "Register";
                switchModeText.innerText = "Already have an account? Log in";
            }
        };

        // Handle Authentication & Firestore Data Saving
        authActionButton.onclick = async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                alert("Please fill in both email and password!");
                return;
            }

            try {
                let userCredential;
                if (isLoginMode) {
                    // Login Existing User
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                    alert("Successfully Logged In!");
                } else {
                    // Register New User
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Save user info to Firestore database
                    await setDoc(doc(db, "users", user.uid), {
                        email: email,
                        createdAt: new Date().toISOString()
                    });
                    alert("Account Created & Saved to Database Successfully!");
                }

                modal.style.display = 'none';
            } catch (error) {
                alert("Error: " + error.message);
            }
        };
    </script>
</body>
</html>
